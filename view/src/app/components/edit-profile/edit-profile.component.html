<div class="form-c">

    <h1>Edit profile</h1>

    <form onsubmit="return false">
        <div class="form-c-grid">

            <label for="username">Username</label>
            <input id="username" name = "username" [(ngModel)]="profileData.username" type="text">

        </div>
    </form>

    <div class="form-c-button-space">
        <button (click)="updateProfile()"></button>
    </div>

</div>
