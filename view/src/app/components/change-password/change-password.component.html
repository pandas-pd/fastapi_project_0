<div class="change-form">

    <h1>Change password</h1>

    <div class="change-password-form">
        <form id="changeForm" onsubmit="return false">
            <input type="password" id="current-password" placeholder="Current password" required>
            <input type="password" id="new-password" placeholder="New password" required>
            <input type="password" id="repeat-password" placeholder="Repeat new password" required>
            <button type="submit" id="save-button" (click)="changePassword()">Save</button>
            <button type="back" id="back-button" class="secondary-button" (click)="back()">Back</button>
        </form>

    </div>

</div>
