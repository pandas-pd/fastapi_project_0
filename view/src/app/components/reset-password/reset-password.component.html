<div class="form-s-div">

    <h1>Reset password</h1>

    <div>
        <form id="resetForm" (ngSubmit)="resetPassword()">
            <input type="text" name="username" placeholder="Username"  [(ngModel)]="username" required>
            <button type="submit">Reset password</button>
        </form>

    </div>

</div>
